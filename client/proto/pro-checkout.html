<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pro payment - MALACONDA</title>
<meta name="description" content="Pay your Malaconda order with your pro prices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="proto.css">
</head>
<body>
<div id="site-nav"></div>
<main id="app"></main>
<div id="site-footer"></div>
<script src="engine.js"></script>
<script src="store.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
<script>
Common.mount({active:"pro-checkout.html"});
/* Pro payment: the same card payment as a consumer, at the pro's own prices (excl. VAT, VAT added at the end).
   Whoever prefers an invoice or a conversation writes to the founders instead. */
Auth.gate("pro","Pro payment","Log in to pay with your prices.",function(user){
  const {esc,chf,pct,$}=Common, F=Store.FLAVORS, VAT=Store.get().settings.vatPct;
  const KEY="mlc_pro_order";
  let done=null;
  const lines=()=>{ try{ return (JSON.parse(sessionStorage.getItem(KEY))||[]).filter(l=>F[l.flavor]&&l.boxes>0); }catch(e){ return []; } };
  const steps=cur=>`<ol class="steps"><li><a href="index.html#flavors">Prices</a></li><li aria-current="${cur==="pay"?"step":"false"}">Payment</li></ol>`;

  function render(){
    const root=$("#app");
    if(done) return finished(root);
    const L=lines();
    if(!L.length){ root.innerHTML=`<section class="block">${steps("pay")}<div class="stack narrow"><h1 class="display h2">Nothing to pay yet</h1><p>Choose your quantities on the site, with your own prices.</p><div><a class="btn" href="index.html#flavors">See my prices</a></div></div></section>`; return; }
    const p=Store.previewProOrder(user.id,L), vat=Math.round(p.net*VAT)/100, total=Math.round((p.net+vat)*100)/100;
    root.innerHTML=`<section class="block">${steps("pay")}
      <div class="shopgrid"><div class="stack"><h1 class="display h2">Pay your order</h1>
        <form class="stack" id="co" novalidate>
          <div class="co-block"><h2 class="co-title"><span>1</span>Delivery</h2><div class="form-grid">
            <div class="field full"><label class="label" for="c-name">Venue</label><input class="input" id="c-name" value="${esc(user.name||"")}" required></div>
            <div class="field full"><label class="label" for="c-address">Street and number</label><input class="input" id="c-address" value="${esc(user.address||"")}" required></div>
            <div class="field"><label class="label" for="c-zip">Postcode</label><input class="input" id="c-zip" value="${esc(user.zip||"")}" required></div>
            <div class="field"><label class="label" for="c-city">City</label><input class="input" id="c-city" value="${esc(user.city||"")}" required></div></div></div>
          <div class="co-block"><h2 class="co-title"><span>2</span>Payment</h2>
            <p class="small">Secure card payment by Stripe. <span class="badge">Test mode</span> The invoice goes to <span class="paper">${esc(user.email)}</span>.</p>
            <div class="form-grid">
              <div class="field full"><label class="label" for="p-num">Card number</label><input class="input" id="p-num" inputmode="numeric" autocomplete="off" placeholder="4242 4242 4242 4242" required></div>
              <div class="field"><label class="label" for="p-exp">Expiry</label><input class="input" id="p-exp" inputmode="numeric" autocomplete="off" placeholder="MM / YY" required></div>
              <div class="field"><label class="label" for="p-cvc">CVC</label><input class="input" id="p-cvc" inputmode="numeric" autocomplete="off" placeholder="123" required></div></div>
            <p class="hint">Prototype: no real payment. Any test card works, for example 4242 4242 4242 4242.</p></div>
          <button class="btn" id="pay" type="submit">Pay ${chf(total)}</button><div id="co-err"></div>
          <p class="small">Prefer an invoice or to talk first? <a class="link-quiet" href="index.html#contact">Message us</a>.</p>
        </form></div>
        <aside class="card stack"><p class="label">Your order, ${esc(user.name)}</p>
          <table class="breakdown">${p.lines.map(r=>`<tr><td>${r.boxes} box${r.boxes>1?"es":""} of ${F[r.flavor].name}<br><span class="small muted">12 bottles of 20 cl each, ${chf(r.boxPrice)} per box</span></td><td>${chf(r.amount)}</td></tr>`).join("")}
          ${p.tierPct?`<tr class="neg"><td>Volume −${p.tierPct}%</td><td>−${chf(p.tierAmount)}</td></tr>`:""}
          ${p.welcomePct?`<tr class="neg"><td>Welcome −${p.welcomePct}%</td><td>−${chf(p.extraAmount)}</td></tr>`:""}
          ${p.creditPct?`<tr class="neg"><td>Referral credit −${p.creditPct}%</td><td>−${chf(p.extraAmount)}</td></tr>`:""}
          <tr><td>Total excl. VAT</td><td>${chf(p.net)}</td></tr>
          <tr><td>VAT ${VAT}%</td><td>${chf(vat)}</td></tr>
          <tr class="total"><td>Total to pay</td><td>${chf(total)}</td></tr></table>
          <a class="link-quiet" href="index.html#flavors">Change quantities</a></aside></div></section>`;
  }

  function finished(root){
    root.innerHTML=`<section class="block">${steps("done")}<div class="stack narrow"><h1 class="display h2">Thank you.</h1>
      <div class="alert alert--ok">Order ${esc(done.id)} is paid: ${done.boxes} box${done.boxes>1?"es":""} of 12 bottles, ${chf(done.net)} excl. VAT.</div>
      <p>The invoice goes to <span class="paper">${esc(user.email)}</span>. Delivery within 4 weeks.</p>
      <div class="row"><a class="btn" href="pro-space.html#orders">Track my order</a><a class="link-quiet" href="index.html">Back to the site</a></div></div></section>`;
    scrollTo(0,0);
  }

  document.addEventListener("submit",e=>{
    if(e.target.id!=="co") return; e.preventDefault();
    const v=i=>$("#"+i).value.trim(), err=t=>{ $("#co-err").innerHTML=`<div class="alert alert--warn">${t}</div>`; };
    if(!v("c-name")||!v("c-address")||!v("c-zip")||!v("c-city")) return err("Fill in the delivery address.");
    const digits=v("p-num").replace(/\D/g,"");
    if(digits.length<12||!/\d{2}\s*\/?\s*\d{2}/.test(v("p-exp"))||v("p-cvc").replace(/\D/g,"").length<3) return err("Check your card details.");
    try{
      // card details are never stored: only the test payment reference stays on the order
      done=Store.payProOrder({proId:user.id,lines:lines(),shipping:{address:v("c-address"),zip:v("c-zip"),city:v("c-city")},paymentRef:"pi_test_"+Math.random().toString(36).slice(2,12)});
      try{ sessionStorage.removeItem(KEY); }catch(x){}
      render();
    }catch(x){ err(esc(x.message)); }
  });
  render();
});
</script>
</body>
</html>
