<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Cart - MALACONDA</title>
<meta name="description" content="Your Malaconda cart. Biting Lulo and Sweet Guava by the box of 12 x 20 cl.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="proto.css">
</head>
<body>
<div id="site-nav"></div>
<main><section class="block">
  <ol class="steps" aria-label="Checkout steps"><li><a href="index.html#flavors">Shop</a></li><li aria-current="step">Cart</li><li>Payment</li></ol>
  <div class="shopgrid">
    <div class="stack">
      <h1 class="display h2">Your cart</h1>
      <div class="stack" id="lines"></div>
      <p class="small">1 box = 12 bottles of 20 cl. Mix both flavours freely. Delivery within 5 working days, or free pickup. <a class="link-quiet" href="index.html#flavors">Keep shopping</a></p>
    </div>
    <aside class="card stack">
      <p class="label">Your order</p>
      <table class="breakdown" id="bd"></table>
      <div id="offer"></div>
      <a class="btn" id="go" href="checkout.html">Checkout →</a>
    </aside>
  </div>
</section></main>
<div id="site-footer"></div>
<script src="engine.js"></script>
<script src="store.js"></script>
<script src="common.js"></script>
<script>
Common.mount({active:"shop.html"});
(function(){
  const {esc,chf,pct,$,Cart,IMG}=Common, F=Store.FLAVORS, S=()=>Store.get().settings;
  function lines(){
    const c=Cart.get();
    $("#lines").innerHTML=Object.keys(F).map(k=>`<div class="card card--flat orow" data-flavor="${k}" style="border-left:3px solid var(--accent)">
      <img src="${IMG[k]}" alt="" width="88" height="110">
      <div><h2 class="flavor-name flavor-name--sm">${F[k].name}</h2><p class="small">${chf(S().retailPrice)} per box</p></div>
      <div class="qty"><button type="button" data-d="-1" data-k="${k}" aria-label="Fewer ${F[k].name}">−</button><input id="q-${k}" value="${c[k]}" inputmode="numeric" aria-label="Boxes of ${F[k].name}"><button type="button" data-d="1" data-k="${k}" aria-label="More ${F[k].name}">+</button></div></div>`).join("");
  }
  function totals(){
    const sum=Common.cartSummary(), p=sum.price;
    $("#bd").innerHTML=sum.boxes?`<tr><td>${sum.boxes} box${sum.boxes>1?"es":""} × ${chf(S().retailPrice)}</td><td>${chf(p.gross)}</td></tr>`+
      (p.welcomePct?`<tr class="neg"><td>First order −${pct(p.welcomePct)}</td><td>−${chf(p.discount)}</td></tr>`:"")+
      `<tr class="total"><td>Subtotal</td><td>${chf(p.net)}</td></tr><tr class="vat"><td>VAT ${pct(S().vatPct)} included</td><td>${chf(Engine.vatIncluded(p.net,S()))}</td></tr><tr class="vat"><td>Delivery or free pickup</td><td>At checkout</td></tr>`:`<tr><td class="muted">Your cart is empty</td><td></td></tr>`;
    // the invitation to create an account only appears for someone who would still get the offer
    $("#offer").innerHTML=!sum.boxes?"":sum.user?(p.welcomePct?`<p class="small">${pct(p.welcomePct)} off your first order is applied.</p>`:""):
      `<div class="offer"><p><strong>Create an account and get ${pct(S().consumerWelcomePct)} on your first order.</strong></p><a class="btn btn--sm btn--ghost" href="account.html?signup=1&next=checkout.html">Create an account</a></div>`;
    const go=$("#go"); go.classList.toggle("is-disabled",!sum.boxes); go.setAttribute("aria-disabled",!sum.boxes);
  }
  const render=()=>{ lines(); totals(); };
  // the lines are re-drawn on a step, not while typing, so the field keeps focus
  document.addEventListener("click",e=>{const b=e.target.closest("[data-k][data-d]"); if(!b||b.closest(".cdrawer"))return; Cart.add(b.dataset.k,Number(b.dataset.d));});
  document.addEventListener("input",e=>{const i=e.target.closest("input[id^=q-]"); if(i) Cart.set(i.id.slice(2),Math.max(0,parseInt(i.value)||0));});
  document.addEventListener("cart:changed",()=>{ const a=document.activeElement; if(a&&a.id&&a.id.startsWith("q-")) totals(); else render(); });
  $("#go").addEventListener("click",e=>{ if(!Cart.count()) e.preventDefault(); });
  render();
})();
</script>
</body>
</html>
